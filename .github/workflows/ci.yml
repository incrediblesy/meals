
name: Meals CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:

  # ================= QUALITY CHECKS =================

  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        with:
          name: meals-test-coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04

    needs:
      - quality
      - android
      - windows
      - web

    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      github.event.created == true &&
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    timeout-minutes: 15

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: meals-android-debug
          path: artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: meals-windows-x64
          path: artifacts/windows

      - name: Download Web artifact
        uses: actions/download-artifact@v8
        with:
          name: meals-web
          path: artifacts/web

      - name: Prepare release assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $TAG"
            exit 1
          fi

          mkdir -p dist

          cp artifacts/android/app-debug.apk \
            "dist/Meals-${TAG}-android-debug.apk"

          (
            cd artifacts/windows
            zip -qr "../../dist/Meals-${TAG}-windows-x64.zip" .
          )

          (
            cd artifacts/web
            zip -qr "../../dist/Meals-${TAG}-web.zip" .
          )

          (
            cd dist
            sha256sum *.apk *.zip > SHA256SUMS.txt
          )

          ls -lh dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" \
            --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to overwrite."
            exit 1
          fi

          EXTRA_ARGS=()

          if [[ "$TAG" == *-* ]]; then
            EXTRA_ARGS+=(--prerelease --latest=false)
          fi

          gh release create "$TAG" \
            dist/* \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "Meals $TAG" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
          
  # ================= ANDROID BUILD =================

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --no-pub

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: meals-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # ================= WINDOWS BUILD =================

  windows:
    name: Build Windows x64
    runs-on: windows-2022
    needs: quality
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --no-pub

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: meals-windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14
          if-no-files-found: error

  # ================= WEB BUILD =================

  web:
    name: Build Web
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-pub

      - name: Upload Web application
        uses: actions/upload-artifact@v7
        with:
          name: meals-web
          path: build/web/
          retention-days: 14
          if-no-files-found: error
