name: meals
description: A cross-platform recipe discovery, cooking and meal planning application.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.14.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.2.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  dio: ^5.11.1
  url_launcher: ^6.3.3
  window_manager: ^0.7.1
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.7
  flutter_cache_manager: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
# dart pub get
# dart run flutter_launcher_icons
